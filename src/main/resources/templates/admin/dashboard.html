<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard Administrador')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Dashboard')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-people-fill"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Empleados activos</div>
                                <div class="fs-3 fw-bold" th:text="${totalEmpleados}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-success bg-opacity-10 text-success">
                                <i class="bi bi-boxes"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Productos</div>
                                <div class="fs-3 fw-bold" th:text="${totalProductos}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                                <i class="bi bi-clipboard-check"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Pedidos</div>
                                <div class="fs-3 fw-bold" th:text="${totalPedidos}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-info bg-opacity-10 text-info">
                                <i class="bi bi-truck"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Entregas</div>
                                <div class="fs-3 fw-bold" th:text="${totalEntregas}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Low Stock Alert -->
                <div class="col-lg-5">
                    <div class="card h-100">
                        <div class="card-header d-flex align-items-center gap-2 bg-white border-bottom">
                            <i class="bi bi-exclamation-triangle text-warning"></i>
                            <span class="fw-semibold">Productos con stock bajo</span>
                            <span class="badge bg-warning text-dark ms-auto" th:text="${productosBajoStock.size()}">0</span>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${productosBajoStock.isEmpty()}" class="text-center text-muted p-4">
                                <i class="bi bi-check-circle text-success fs-3"></i>
                                <p class="mt-2 mb-0">Todos los productos tienen stock suficiente</p>
                            </div>
                            <ul class="list-group list-group-flush" th:unless="${productosBajoStock.isEmpty()}">
                                <li class="list-group-item d-flex align-items-center" th:each="p : ${productosBajoStock}">
                                    <div class="flex-grow-1">
                                        <div class="fw-semibold" th:text="${p.nombre}">Producto</div>
                                        <small class="text-muted" th:text="${p.ubicacion}">Ubicación</small>
                                    </div>
                                    <span class="badge bg-danger" th:text="${p.stock} + ' / ' + ${p.stockMinimo}">0</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Recent Deliveries -->
                <div class="col-lg-7">
                    <div class="card h-100">
                        <div class="card-header d-flex align-items-center gap-2 bg-white border-bottom">
                            <i class="bi bi-truck text-primary"></i>
                            <span class="fw-semibold">Últimas entregas</span>
                            <a th:href="@{/admin/entregas}" class="btn btn-sm btn-outline-primary ms-auto">Ver todas</a>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${ultimasEntregas.isEmpty()}" class="text-center text-muted p-4">
                                <i class="bi bi-inbox fs-3"></i>
                                <p class="mt-2 mb-0">No hay entregas registradas</p>
                            </div>
                            <div class="table-responsive" th:unless="${ultimasEntregas.isEmpty()}">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Repartidor</th>
                                        <th>Fecha prevista</th>
                                        <th>Estado</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="e : ${ultimasEntregas}">
                                        <td th:text="${e.id}">1</td>
                                        <td th:text="${e.repartidor != null ? e.repartidor.nombre : '—'}">—</td>
                                        <td th:text="${e.fechaPrevista != null ? e.fechaPrevista : '—'}">—</td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="'badge-estado-' + ${e.estado.name()}"
                                                  th:text="${e.estado.name().replace('_',' ')}">Estado</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
