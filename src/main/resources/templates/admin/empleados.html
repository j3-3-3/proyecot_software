<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Empleados')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('empleados')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Gestión de Empleados')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-semibold mb-0">Empleados activos</h5>
                <a th:href="@{/admin/empleados/nuevo}" class="btn btn-primary">
                    <i class="bi bi-person-plus me-2"></i>Nuevo empleado
                </a>
            </div>

            <div class="card">
                <div class="card-body p-0">
                    <div th:if="${empleados.isEmpty()}" class="text-center text-muted p-5">
                        <i class="bi bi-people fs-1"></i>
                        <p class="mt-2">No hay empleados registrados</p>
                    </div>
                    <div class="table-responsive" th:unless="${empleados.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="u : ${empleados}">
                                <td th:text="${u.id}">1</td>
                                <td class="fw-semibold" th:text="${u.nombre}">Nombre</td>
                                <td><code th:text="${u.username}">usuario</code></td>
                                <td th:text="${u.email ?: '—'}">email</td>
                                <td>
                                    <span th:switch="${u.rol.name()}">
                                        <span th:case="'ADMIN'" class="badge bg-danger">Admin</span>
                                        <span th:case="'OPERARIO'" class="badge bg-info text-dark">Operario</span>
                                        <span th:case="'REPARTIDOR'" class="badge bg-success">Repartidor</span>
                                        <span th:case="*" class="badge bg-secondary" th:text="${u.rol.name()}">Rol</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-end">
                                    <form th:action="@{/admin/empleados/{id}/eliminar(id=${u.id})}"
                                          method="post"
                                          onsubmit="return confirm('¿Desactivar este empleado?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                th:disabled="${u.rol.name() == 'ADMIN'}">
                                            <i class="bi bi-person-dash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
