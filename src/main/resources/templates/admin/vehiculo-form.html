<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nuevo Vehículo')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('vehiculos')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Registrar Vehículo')}"></div>
        <main class="content">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header bg-white border-bottom">
                            <h6 class="mb-0 fw-semibold">
                                <i class="bi bi-truck me-2 text-primary"></i>Registrar vehículo
                            </h6>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/vehiculos/nuevo}" th:object="${vehiculo}" method="post">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Matrícula <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{matricula}" class="form-control"
                                               placeholder="Ej: 1234-ABC" required
                                               th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid'">
                                        <div class="invalid-feedback" th:errors="*{matricula}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Tipo</label>
                                        <select th:field="*{tipo}" class="form-select">
                                            <option value="">-- Seleccionar --</option>
                                            <option value="FURGONETA">Furgoneta</option>
                                            <option value="CAMION">Camión</option>
                                            <option value="MOTO">Moto</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Marca</label>
                                        <input type="text" th:field="*{marca}" class="form-control" placeholder="Ej: Renault">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Modelo</label>
                                        <input type="text" th:field="*{modelo}" class="form-control" placeholder="Ej: Master">
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" th:field="*{disponible}" id="disponible">
                                            <label class="form-check-label" for="disponible">Disponible</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save me-2"></i>Registrar
                                    </button>
                                    <a th:href="@{/admin/vehiculos}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
