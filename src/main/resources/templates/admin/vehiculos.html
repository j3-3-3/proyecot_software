<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('vehiculos')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Gestión de Vehículos')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-semibold mb-0">Flota de vehículos</h5>
                <a th:href="@{/admin/vehiculos/nuevo}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-2"></i>Registrar vehículo
                </a>
            </div>

            <div class="row g-4" th:if="${!vehiculos.isEmpty()}">
                <div class="col-sm-6 col-xl-4" th:each="v : ${vehiculos}">
                    <div class="card h-100">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                    <i class="bi bi-truck-flatbed"></i>
                                </div>
                                <div>
                                    <div class="fw-bold" th:text="${v.matricula}">Matrícula</div>
                                    <small class="text-muted" th:text="${v.tipo}">Tipo</small>
                                </div>
                                <span class="ms-auto badge"
                                      th:classappend="${v.disponible} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${v.disponible} ? 'Disponible' : 'No disponible'">Estado</span>
                            </div>
                            <div class="small text-muted">
                                <div><strong>Marca:</strong> <span th:text="${v.marca ?: '—'}">—</span></div>
                                <div><strong>Modelo:</strong> <span th:text="${v.modelo ?: '—'}">—</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${vehiculos.isEmpty()}" class="text-center text-muted p-5">
                <i class="bi bi-car-front fs-1"></i>
                <p class="mt-2">No hay vehículos registrados</p>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
