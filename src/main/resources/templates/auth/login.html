<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body>
<div class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <div class="login-card card p-4 p-md-5">
        <!-- Logo / Brand -->
        <div class="text-center mb-4">
            <div class="mb-3">
                <i class="bi bi-truck fs-1 text-primary"></i>
            </div>
            <h2 class="fw-bold mb-1">LogiSys</h2>
            <p class="text-muted small">Sistema de Gestión Logística</p>
        </div>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Usuario o contraseña incorrectos.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            Sesión cerrada correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person text-muted"></i>
                    </span>
                    <input type="text" id="username" name="username" class="form-control border-start-0"
                           placeholder="Nombre de usuario" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-lock text-muted"></i>
                    </span>
                    <input type="password" id="password" name="password" class="form-control border-start-0"
                           placeholder="Contraseña" required>
                </div>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </div>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            <i class="bi bi-shield-lock me-1"></i>
            Acceso restringido a personal autorizado
        </p>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
