<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <h1 class="display-6 fw-bold text-dark">
                    <i class="bi bi-truck text-primary me-2"></i>LogiSys
                </h1>
                <p class="text-muted">Sistema de Gestión Logística</p>
            </div>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4 text-center">Iniciar Sesión</h5>

                    <div th:if="${param.error}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        Credenciales incorrectas. Inténtelo de nuevo.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        Ha cerrado sesión correctamente.
                    </div>
                    <div th:if="${param.denied}" class="alert alert-warning py-2 small">
                        <i class="bi bi-shield-exclamation me-1"></i>
                        No tiene permisos para acceder a esa página.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Correo electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="username" name="username"
                                       placeholder="usuario@ejemplo.com" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <small class="text-muted">
                    <i class="bi bi-info-circle me-1"></i>
                    Contacte con el administrador para acceder al sistema.
                </small>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
