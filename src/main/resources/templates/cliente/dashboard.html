<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mi Panel')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Mi Panel')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-4">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-clipboard-check"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Total pedidos</div>
                                <div class="fs-3 fw-bold" th:text="${misPedidos.size()}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                                <i class="bi bi-clock"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Pedidos activos</div>
                                <div class="fs-3 fw-bold" th:text="${pedidosActivos}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent orders -->
            <div class="card mb-4">
                <div class="card-header bg-white border-bottom fw-semibold d-flex align-items-center">
                    <i class="bi bi-clipboard me-2 text-primary"></i>Mis pedidos recientes
                    <a th:href="@{/cliente/mis-pedidos}" class="btn btn-sm btn-outline-primary ms-auto">Ver todos</a>
                </div>
                <div class="card-body p-0">
                    <div th:if="${misPedidos.isEmpty()}" class="text-center text-muted p-5">
                        <i class="bi bi-clipboard-x fs-1"></i>
                        <p class="mt-2">No tienes pedidos todavía</p>
                        <a th:href="@{/cliente/nuevo-pedido}" class="btn btn-primary btn-sm">
                            <i class="bi bi-cart-plus me-1"></i>Hacer un pedido
                        </a>
                    </div>
                    <div class="table-responsive" th:unless="${misPedidos.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Fecha</th>
                                <th>Dirección</th>
                                <th>Productos</th>
                                <th>Estado</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${misPedidos}" th:if="${#lists.size(misPedidos) > 0}"
                                th:with="count=${0}">
                                <td th:text="${p.id}">1</td>
                                <td class="text-muted small"
                                    th:text="${#temporals.format(p.fechaSolicitud,'dd/MM/yyyy')}">fecha</td>
                                <td th:text="${p.direccionEntrega ?: '—'}">—</td>
                                <td><span class="badge bg-light text-dark border" th:text="${p.detalles.size()} + ' ítem(s)'">0</span></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="'badge-estado-' + ${p.estado.name()}"
                                          th:text="${p.estado.name().replace('_',' ')}">Estado</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Quick actions -->
            <div class="row g-3">
                <div class="col-sm-6">
                    <a th:href="@{/cliente/nuevo-pedido}" class="btn btn-outline-primary w-100 py-3">
                        <i class="bi bi-cart-plus d-block fs-4 mb-1"></i>
                        Nuevo pedido
                    </a>
                </div>
                <div class="col-sm-6">
                    <a th:href="@{/cliente/mis-pedidos}" class="btn btn-outline-secondary w-100 py-3">
                        <i class="bi bi-list-check d-block fs-4 mb-1"></i>
                        Ver mis pedidos
                    </a>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
