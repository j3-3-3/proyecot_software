<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nuevo Pedido')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('nuevo-pedido')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Realizar Pedido')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-white border-bottom">
                            <h6 class="mb-0 fw-semibold">
                                <i class="bi bi-cart-plus me-2 text-primary"></i>Realizar nuevo pedido
                            </h6>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/cliente/nuevo-pedido}" method="post">
                                <!-- Delivery info -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Dirección de entrega</label>
                                    <input type="text" name="direccion" class="form-control"
                                           placeholder="Calle, número, ciudad...">
                                </div>

                                <!-- Products -->
                                <h6 class="fw-semibold mb-3">Seleccionar productos</h6>

                                <div th:if="${productos.isEmpty()}" class="alert alert-warning">
                                    <i class="bi bi-exclamation-triangle me-2"></i>
                                    No hay productos disponibles en este momento.
                                </div>

                                <div class="row g-3 mb-4" th:unless="${productos.isEmpty()}">
                                    <div class="col-md-6" th:each="p : ${productos}">
                                        <div class="card border">
                                            <div class="card-body p-3">
                                                <div class="d-flex align-items-start gap-2">
                                                    <div class="flex-grow-1">
                                                        <div class="fw-semibold" th:text="${p.nombre}">Producto</div>
                                                        <small class="text-muted" th:text="${p.descripcion}"></small>
                                                        <div class="mt-1">
                                                            <span class="badge bg-success small"
                                                                  th:text="'Disponible: ' + ${p.stock}">Stock</span>
                                                            <span th:if="${p.categoria}" class="badge bg-secondary small ms-1"
                                                                  th:text="${p.categoria}">Cat</span>
                                                        </div>
                                                    </div>
                                                    <div style="width: 80px;">
                                                        <label class="form-label small text-muted">Cant.</label>
                                                        <input type="number"
                                                               th:name="'cantidad_' + ${p.id}"
                                                               class="form-control form-control-sm"
                                                               min="0"
                                                               th:max="${p.stock}"
                                                               value="0">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Observations -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Observaciones</label>
                                    <textarea name="observaciones" class="form-control" rows="2"
                                              placeholder="Indicaciones especiales para la entrega..."></textarea>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary" th:unless="${productos.isEmpty()}">
                                        <i class="bi bi-check-circle me-2"></i>Confirmar pedido
                                    </button>
                                    <a th:href="@{/cliente/mis-pedidos}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
