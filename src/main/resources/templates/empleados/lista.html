<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empleados')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold"><i class="bi bi-people me-2 text-primary"></i>Empleados</h2>
        <a th:href="@{/empleados/nuevo}" class="btn btn-primary">
            <i class="bi bi-person-plus me-1"></i>Nuevo Empleado
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay usuarios registrados.
                            </td>
                        </tr>
                        <tr th:each="u : ${usuarios}">
                            <td class="text-muted small" th:text="${u.id}">#</td>
                            <td>
                                <div class="fw-semibold" th:text="${u.nombreCompleto}">Nombre</div>
                            </td>
                            <td class="small text-muted" th:text="${u.email}">email</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.rol.name() == 'ADMIN'} ? 'text-bg-danger' :
                                                     (${u.rol.name() == 'OPERARIO'} ? 'text-bg-warning text-dark' :
                                                     (${u.rol.name() == 'REPARTIDOR'} ? 'text-bg-info text-dark' : 'text-bg-success'))"
                                      th:text="${u.rol.name()}">ROL</span>
                            </td>
                            <td>
                                <span th:classappend="${u.activo} ? 'text-success' : 'text-danger'"
                                      th:text="${u.activo} ? 'Activo' : 'Inactivo'">Estado</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/empleados/{id}/editar(id=${u.id})}" class="btn btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-outline-danger" title="Desactivar"
                                            data-bs-toggle="modal" th:data-bs-target="'#delModal' + ${u.id}">
                                        <i class="bi bi-person-x"></i>
                                    </button>
                                </div>
                                <div class="modal fade" th:id="'delModal' + ${u.id}" tabindex="-1">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Desactivar usuario</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                ¿Desactivar a <strong th:text="${u.nombreCompleto}"></strong>?
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <form th:action="@{/empleados/{id}/eliminar(id=${u.id})}" method="post">
                                                    <button type="submit" class="btn btn-danger">Desactivar</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${#lists.size(usuarios)}">0</strong> usuarios
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
