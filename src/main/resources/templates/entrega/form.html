<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Entrega - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/entregas}">Entregas</a></li>
            <li class="breadcrumb-item active">Nueva entrega</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <h2 class="h4 fw-bold mb-0">
                <i class="bi bi-plus-circle me-2 text-primary"></i>Nueva Entrega
            </h2>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/entregas/nueva}" method="post" id="entregaForm">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="clienteId" class="form-label fw-semibold">
                            Cliente <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="clienteId" name="clienteId" required>
                            <option value="">-- Seleccionar cliente --</option>
                            <option th:each="c : ${clientes}"
                                    th:value="${c.id}"
                                    th:text="${c.getNombreCompleto() + ' (' + c.username + ')'}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="direccionEntrega" class="form-label fw-semibold">
                            Dirección de entrega <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="direccionEntrega"
                               name="direccionEntrega" placeholder="Calle, número, ciudad..."
                               required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="repartidorId" class="form-label fw-semibold">Repartidor</label>
                        <select class="form-select" id="repartidorId" name="repartidorId">
                            <option value="">-- Asignar más tarde --</option>
                            <option th:each="r : ${repartidores}"
                                    th:value="${r.id}"
                                    th:text="${r.getNombreCompleto()}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="vehiculoId" class="form-label fw-semibold">Vehículo</label>
                        <select class="form-select" id="vehiculoId" name="vehiculoId">
                            <option value="">-- Asignar más tarde --</option>
                            <option th:each="v : ${vehiculos}"
                                    th:value="${v.id}"
                                    th:text="${v.marca + ' ' + v.modelo + ' (' + v.matricula + ')'}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <label for="fechaEntregaPrevista" class="form-label fw-semibold">Fecha de entrega prevista</label>
                        <input type="date" class="form-control" id="fechaEntregaPrevista"
                               name="fechaEntregaPrevista">
                    </div>
                    <div class="col-md-8">
                        <label for="notas" class="form-label fw-semibold">Notas</label>
                        <input type="text" class="form-control" id="notas"
                               name="notas" placeholder="Observaciones...">
                    </div>
                </div>

                <!-- Products section -->
                <hr>
                <h5 class="fw-semibold mb-3"><i class="bi bi-grid me-2"></i>Productos</h5>

                <div id="productosContainer">
                    <div class="product-row row g-2 mb-2 align-items-end">
                        <div class="col-md-7">
                            <label class="form-label">Producto</label>
                            <select class="form-select" name="productoIds">
                                <option value="">-- Seleccionar --</option>
                                <option th:each="p : ${productos}"
                                        th:value="${p.id}"
                                        th:text="${p.nombre + ' (Stock: ' + p.getStockDisponible() + ')'}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" class="form-control" name="cantidades" min="1" value="1">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger w-100" onclick="removeProductRow(this)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-secondary mb-4" onclick="addProductRow()">
                    <i class="bi bi-plus-circle me-2"></i>Añadir producto
                </button>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-2"></i>Crear Entrega
                    </button>
                    <a th:href="@{/entregas}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-2"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/custom.js}"></script>
<script>
    // Store product options HTML for dynamic rows
    const productoOptions = document.querySelector('[name="productoIds"]').innerHTML;

    function addProductRow() {
        const container = document.getElementById('productosContainer');
        const row = document.createElement('div');
        row.className = 'product-row row g-2 mb-2 align-items-end';
        row.innerHTML = `
            <div class="col-md-7">
                <select class="form-select" name="productoIds">
                    ${productoOptions}
                </select>
            </div>
            <div class="col-md-3">
                <input type="number" class="form-control" name="cantidades" min="1" value="1">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-danger w-100" onclick="removeProductRow(this)">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        `;
        container.appendChild(row);
    }

    function removeProductRow(btn) {
        const rows = document.querySelectorAll('.product-row');
        if (rows.length > 1) {
            btn.closest('.product-row').remove();
        }
    }
</script>
</body>
</html>
