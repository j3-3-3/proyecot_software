<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregas - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Gestión de Entregas</h1>
        <a th:href="@{/entregas/nueva}" class="btn btn-primary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus-circle me-2"></i>Nueva Entrega
        </a>
    </div>

    <!-- Filter -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/entregas}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Filtrar por estado</label>
                    <select class="form-select" name="estado">
                        <option value="">Todos los estados</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${e.label}"
                                th:selected="${estadoFiltro != null and estadoFiltro == e.name()}">
                        </option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/entregas}" class="btn btn-outline-secondary w-100">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Deliveries Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Cliente</th>
                            <th>Repartidor</th>
                            <th>Estado</th>
                            <th>Dirección</th>
                            <th>Fecha</th>
                            <th>Entrega prevista</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${entregas.isEmpty()}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay entregas registradas.
                            </td>
                        </tr>
                        <tr th:each="entrega : ${entregas}">
                            <td><code th:text="${entrega.numeroPedido}"></code></td>
                            <td th:text="${entrega.cliente.getNombreCompleto()}"></td>
                            <td>
                                <span th:if="${entrega.repartidor != null}"
                                      th:text="${entrega.repartidor.getNombreCompleto()}"></span>
                                <span th:if="${entrega.repartidor == null}" class="text-muted">Sin asignar</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${entrega.estado.name() == 'ENTREGADO' ? 'bg-success' :
                                                       entrega.estado.name() == 'CANCELADO' ? 'bg-danger' :
                                                       entrega.estado.name() == 'EN_REPARTO' ? 'bg-info' :
                                                       entrega.estado.name() == 'INCIDENCIA' ? 'bg-warning text-dark' :
                                                       entrega.estado.name() == 'PENDIENTE' ? 'bg-secondary' : 'bg-light text-dark'}"
                                      th:text="${entrega.estado.label}"></span>
                            </td>
                            <td th:text="${entrega.direccionEntrega}"></td>
                            <td>
                                <span th:if="${entrega.fechaPedido != null}"
                                      th:text="${#temporals.format(entrega.fechaPedido, 'dd/MM/yyyy')}"></span>
                            </td>
                            <td>
                                <span th:if="${entrega.fechaEntregaPrevista != null}"
                                      th:text="${#temporals.format(entrega.fechaEntregaPrevista, 'dd/MM/yyyy')}"></span>
                                <span th:if="${entrega.fechaEntregaPrevista == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/entregas/{id}(id=${entrega.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye me-1"></i>Ver
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
