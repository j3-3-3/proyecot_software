<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Asignar Entrega')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/entregas}">Entregas</a></li>
            <li class="breadcrumb-item"><a th:href="@{/entregas/{id}(id=${entrega.id})}"
                                           th:text="'Entrega #' + ${entrega.id}">Entrega</a></li>
            <li class="breadcrumb-item active">Asignar</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-person-check text-primary me-2"></i>
                        Asignar Entrega #<span th:text="${entrega.id}"></span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Current info -->
                    <div class="alert alert-light border mb-4">
                        <div class="small text-muted fw-semibold mb-1">PEDIDO</div>
                        <strong th:text="'#' + ${entrega.pedido.id} + ' — ' + ${entrega.pedido.cliente.nombreCompleto}">-</strong>
                        <div class="small text-muted mt-1" th:text="${entrega.pedido.direccionEntrega}">Dirección</div>
                    </div>

                    <form th:action="@{/entregas/{id}/asignar(id=${entrega.id})}" th:object="${form}" method="post" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="repartidorId" class="form-label fw-semibold">Repartidor</label>
                                <select class="form-select" id="repartidorId" th:field="*{repartidorId}">
                                    <option value="">-- Seleccionar repartidor --</option>
                                    <option th:each="r : ${repartidores}"
                                            th:value="${r.id}"
                                            th:text="${r.nombreCompleto}">Repartidor</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="vehiculoId" class="form-label fw-semibold">Vehículo</label>
                                <select class="form-select" id="vehiculoId" th:field="*{vehiculoId}">
                                    <option value="">-- Seleccionar vehículo --</option>
                                    <option th:each="v : ${vehiculos}"
                                            th:value="${v.id}"
                                            th:text="${v.descripcion} + ' [' + ${v.tipo} + ']'">Vehículo</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="fechaEntregaPrevista" class="form-label fw-semibold">Fecha Prevista de Entrega</label>
                                <input type="date" class="form-control" id="fechaEntregaPrevista"
                                       th:field="*{fechaEntregaPrevista}">
                            </div>
                            <div class="col-12">
                                <label for="notas" class="form-label fw-semibold">Notas</label>
                                <textarea class="form-control" id="notas" th:field="*{notas}"
                                          rows="3" placeholder="Instrucciones para el repartidor..."></textarea>
                            </div>
                        </div>

                        <hr class="my-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/entregas/{id}(id=${entrega.id})}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Guardar Asignación
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
