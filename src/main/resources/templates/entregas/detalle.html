<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Detalle Entrega')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/entregas}">Entregas</a></li>
            <li class="breadcrumb-item active" th:text="'Entrega #' + ${entrega.id}">Entrega</li>
        </ol>
    </nav>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-truck-front text-primary me-2"></i>Entrega #<span th:text="${entrega.id}"></span>
                    </h5>
                    <span class="badge fs-6"
                          th:classappend="${entrega.estado.name() == 'PENDIENTE'} ? 'text-bg-warning' :
                                         (${entrega.estado.name() == 'EN_REPARTO'} ? 'text-bg-primary' :
                                         (${entrega.estado.name() == 'ENTREGADO'} ? 'text-bg-success' :
                                         (${entrega.estado.name() == 'INCIDENCIA'} ? 'text-bg-danger' : 'text-bg-secondary')))"
                          th:text="${entrega.estado.label}">Estado</span>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">PEDIDO</div>
                            <div>
                                <a th:href="@{/pedidos/{id}(id=${entrega.pedido.id})}"
                                   th:text="'Pedido #' + ${entrega.pedido.id}">Pedido</a>
                            </div>
                            <div class="text-muted small" th:text="${entrega.pedido.cliente.nombreCompleto}">Cliente</div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">DIRECCIÓN DE ENTREGA</div>
                            <div th:text="${entrega.pedido.direccionEntrega}">Dirección</div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">REPARTIDOR</div>
                            <div th:text="${entrega.repartidor != null} ? ${entrega.repartidor.nombreCompleto} : 'Sin asignar'"
                                 th:classappend="${entrega.repartidor == null} ? 'text-muted fst-italic'">-</div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">VEHÍCULO</div>
                            <div th:text="${entrega.vehiculo != null} ? ${entrega.vehiculo.descripcion} : 'Sin asignar'"
                                 th:classappend="${entrega.vehiculo == null} ? 'text-muted fst-italic'">-</div>
                        </div>
                        <div class="col-md-6">
                            <div class="text-muted small fw-semibold">FECHA PREVISTA</div>
                            <div th:text="${entrega.fechaEntregaPrevista != null} ? ${#temporals.format(entrega.fechaEntregaPrevista, 'dd/MM/yyyy')} : 'Sin definir'"
                                 th:classappend="${entrega.fechaEntregaPrevista == null} ? 'text-muted fst-italic'">-</div>
                        </div>
                        <div class="col-md-6" th:if="${entrega.fechaEntregaReal != null}">
                            <div class="text-muted small fw-semibold">ENTREGADO EL</div>
                            <div th:text="${#temporals.format(entrega.fechaEntregaReal, 'dd/MM/yyyy HH:mm')}">-</div>
                        </div>
                        <div class="col-12" th:if="${entrega.notas != null and !#strings.isEmpty(entrega.notas)}">
                            <div class="text-muted small fw-semibold">NOTAS</div>
                            <div th:text="${entrega.notas}">-</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between">
                    <a th:href="@{/entregas}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                    <div class="btn-group">
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/entregas/{id}/asignar(id=${entrega.id})}" class="btn btn-primary">
                            <i class="bi bi-person-check me-1"></i>Asignar
                        </a>
                        <a th:href="@{/entregas/{id}/estado(id=${entrega.id})}" class="btn btn-success">
                            <i class="bi bi-arrow-repeat me-1"></i>Actualizar Estado
                        </a>
                        <button sec:authorize="hasRole('ADMIN')" type="button" class="btn btn-danger"
                                data-bs-toggle="modal" data-bs-target="#cancelModal">
                            <i class="bi bi-x-circle me-1"></i>Cancelar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="cancelModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cancelar Entrega</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">¿Está seguro de que desea cancelar esta entrega?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
                <form th:action="@{/entregas/{id}/cancelar(id=${entrega.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Sí, cancelar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
