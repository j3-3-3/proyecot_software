<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | LogiSys'">LogiSys</title>
    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<!-- Sidebar navigation fragment -->
<nav th:fragment="sidebar(activeMenu)" class="sidebar d-flex flex-column p-3">
    <a th:href="@{/}" class="d-flex align-items-center mb-4 text-decoration-none">
        <i class="bi bi-truck fs-4 text-primary me-2"></i>
        <span class="fs-5 fw-semibold text-white">LogiSys</span>
    </a>
    <hr class="text-secondary">

    <!-- ADMIN menu -->
    <div sec:authorize="hasRole('ADMIN')">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/empleados}"
                   th:classappend="${activeMenu == 'empleados'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-people me-2"></i>Empleados
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/inventario}"
                   th:classappend="${activeMenu == 'inventario'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-boxes me-2"></i>Inventario
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/pedidos}"
                   th:classappend="${activeMenu == 'pedidos'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-clipboard-check me-2"></i>Pedidos
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/entregas}"
                   th:classappend="${activeMenu == 'entregas'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-truck me-2"></i>Entregas
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/admin/vehiculos}"
                   th:classappend="${activeMenu == 'vehiculos'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-car-front me-2"></i>Vehículos
                </a>
            </li>
        </ul>
    </div>

    <!-- OPERARIO menu -->
    <div sec:authorize="hasRole('OPERARIO')">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/operario/dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/operario/inventario}"
                   th:classappend="${activeMenu == 'inventario'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-boxes me-2"></i>Inventario
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/operario/entrada-producto}"
                   th:classappend="${activeMenu == 'entrada'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-box-arrow-in-down me-2"></i>Entrada Producto
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/operario/nuevo-producto}"
                   th:classappend="${activeMenu == 'nuevo-producto'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-plus-square me-2"></i>Nuevo Producto
                </a>
            </li>
        </ul>
    </div>

    <!-- REPARTIDOR menu -->
    <div sec:authorize="hasRole('REPARTIDOR')">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/repartidor/dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/repartidor/mis-entregas}"
                   th:classappend="${activeMenu == 'entregas'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-truck me-2"></i>Mis Entregas
                </a>
            </li>
        </ul>
    </div>

    <!-- CLIENTE menu -->
    <div sec:authorize="hasRole('CLIENTE')">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/cliente/dashboard}"
                   th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-speedometer2 me-2"></i>Mi Panel
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/cliente/mis-pedidos}"
                   th:classappend="${activeMenu == 'pedidos'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-clipboard-check me-2"></i>Mis Pedidos
                </a>
            </li>
            <li class="nav-item">
                <a th:href="@{/cliente/nuevo-pedido}"
                   th:classappend="${activeMenu == 'nuevo-pedido'} ? 'active' : ''"
                   class="nav-link text-white">
                    <i class="bi bi-cart-plus me-2"></i>Nuevo Pedido
                </a>
            </li>
        </ul>
    </div>

    <hr class="text-secondary mt-auto">
    <div class="d-flex align-items-center gap-2 text-white-50 small">
        <i class="bi bi-person-circle fs-5"></i>
        <span sec:authentication="name">Usuario</span>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </form>
    </div>
</nav>

<!-- Top bar fragment -->
<header th:fragment="topbar(pageTitle)" class="topbar d-flex align-items-center px-4 py-2 bg-white border-bottom shadow-sm">
    <h5 class="mb-0 fw-semibold" th:text="${pageTitle}">Página</h5>
    <div class="ms-auto d-flex align-items-center gap-3">
        <span class="text-muted small">
            <i class="bi bi-calendar3 me-1"></i>
            <span id="current-date"></span>
        </span>
        <div class="vr"></div>
        <span class="fw-semibold text-primary" sec:authentication="name">Usuario</span>
    </div>
</header>

<!-- Alert messages fragment -->
<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Scripts fragment -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmOXhSJf2b84z3+kQl8tcJ6X3Qe"
            crossorigin="anonymous"></script>
    <script>
        // Display current date
        const dateEl = document.getElementById('current-date');
        if (dateEl) {
            dateEl.textContent = new Date().toLocaleDateString('es-ES', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }
    </script>
</div>
</html>
