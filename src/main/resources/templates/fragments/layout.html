<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== HEAD FRAGMENT ===== -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | LogiSys'">LogiSys</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<!-- ===== NAVBAR FRAGMENT ===== -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-truck me-2"></i>LogiSys
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"
                       th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'active'">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','OPERARIO')">
                    <a class="nav-link" th:href="@{/inventario}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/inventario')} ? 'active'">
                        <i class="bi bi-boxes me-1"></i>Inventario
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','CLIENTE')">
                    <a class="nav-link" th:href="@{/pedidos}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/pedidos')} ? 'active'">
                        <i class="bi bi-cart3 me-1"></i>Pedidos
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','REPARTIDOR')">
                    <a class="nav-link" th:href="@{/entregas}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/entregas')} ? 'active'">
                        <i class="bi bi-truck-front me-1"></i>Entregas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/empleados}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/empleados')} ? 'active'">
                        <i class="bi bi-people me-1"></i>Empleados
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vehiculos}"
                       th:classappend="${#httpServletRequest.requestURI.startsWith('/vehiculos')} ? 'active'">
                        <i class="bi bi-car-front me-1"></i>Vehículos
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><h6 class="dropdown-header">
                            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger">ADMIN</span>
                            <span sec:authorize="hasRole('OPERARIO')" class="badge bg-warning text-dark">OPERARIO</span>
                            <span sec:authorize="hasRole('REPARTIDOR')" class="badge bg-info text-dark">REPARTIDOR</span>
                            <span sec:authorize="hasRole('CLIENTE')" class="badge bg-success">CLIENTE</span>
                        </h6></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== FLASH MESSAGES FRAGMENT ===== -->
<div th:fragment="messages" class="container mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${info}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== FOOTER FRAGMENT ===== -->
<footer th:fragment="footer" class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center">
        <span class="text-muted small">
            &copy; 2024 LogiSys &mdash; Sistema de Gestión Logística
        </span>
    </div>
</footer>

<!-- ===== SCRIPTS FRAGMENT ===== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
