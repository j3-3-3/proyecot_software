<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-0">
                <i class="bi bi-speedometer2 me-2 text-primary"></i>Panel de Administración
            </h1>
            <p class="text-muted mb-0">Bienvenido, <strong th:text="${usuario.getNombreCompleto()}">Admin</strong></p>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-people-fill fs-2 text-primary"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalUsuarios}">0</div>
                        <div class="text-muted small">Usuarios</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-success bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-box-seam-fill fs-2 text-success"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalEntregas}">0</div>
                        <div class="text-muted small">Total Entregas</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-clock-fill fs-2 text-warning"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${entregasPendientes}">0</div>
                        <div class="text-muted small">Pendientes</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-xl-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-exclamation-triangle-fill fs-2 text-danger"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${productosConBajoStock}">0</div>
                        <div class="text-muted small">Bajo Stock</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <h5 class="fw-semibold mb-3">Acciones rápidas</h5>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/usuarios/nuevo}" class="btn btn-outline-primary w-100">
                <i class="bi bi-person-plus d-block fs-3 mb-1"></i>
                Nuevo Empleado
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/entregas/nueva}" class="btn btn-outline-success w-100">
                <i class="bi bi-plus-circle d-block fs-3 mb-1"></i>
                Nueva Entrega
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/inventario/entrada}" class="btn btn-outline-info w-100">
                <i class="bi bi-arrow-down-circle d-block fs-3 mb-1"></i>
                Entrada Mercancía
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/vehiculos/nuevo}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-car-front d-block fs-3 mb-1"></i>
                Nuevo Vehículo
            </a>
        </div>
    </div>

    <!-- Recent Deliveries -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom-0 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2"></i>Últimas Entregas</h5>
                <a th:href="@{/entregas}" class="btn btn-sm btn-outline-primary">Ver todas</a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Cliente</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${ultimasEntregas.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-4">
                                No hay entregas registradas aún.
                            </td>
                        </tr>
                        <tr th:each="entrega : ${ultimasEntregas}">
                            <td><code th:text="${entrega.numeroPedido}"></code></td>
                            <td th:text="${entrega.cliente.getNombreCompleto()}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${entrega.estado.name() == 'ENTREGADO' ? 'bg-success' :
                                                       entrega.estado.name() == 'CANCELADO' ? 'bg-danger' :
                                                       entrega.estado.name() == 'EN_REPARTO' ? 'bg-info' :
                                                       entrega.estado.name() == 'INCIDENCIA' ? 'bg-warning' :
                                                       entrega.estado.name() == 'PENDIENTE' ? 'bg-secondary' : 'bg-light text-dark'}"
                                      th:text="${entrega.estado.label}"></span>
                            </td>
                            <td>
                                <span th:if="${entrega.fechaPedido != null}"
                                      th:text="${#temporals.format(entrega.fechaPedido, 'dd/MM/yyyy')}"></span>
                            </td>
                            <td>
                                <a th:href="@{/entregas/{id}(id=${entrega.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
