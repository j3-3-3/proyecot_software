<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-0">
                <i class="bi bi-bag me-2 text-primary"></i>Mis Pedidos
            </h1>
            <p class="text-muted mb-0">Bienvenido, <strong th:text="${usuario.getNombreCompleto()}">Cliente</strong></p>
        </div>
        <a th:href="@{/pedidos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Nuevo Pedido
        </a>
    </div>

    <!-- Orders stats -->
    <div class="row g-4 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center py-3">
                    <div class="fs-3 fw-bold text-primary" th:text="${misPedidos.size()}">0</div>
                    <div class="text-muted small">Total</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center py-3">
                    <div class="fs-3 fw-bold text-warning"
                         th:text="${misPedidos.stream().filter(p -> p.estado.name() == 'PENDIENTE' || p.estado.name() == 'EN_REPARTO').count()}">0</div>
                    <div class="text-muted small">En curso</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center py-3">
                    <div class="fs-3 fw-bold text-success"
                         th:text="${misPedidos.stream().filter(p -> p.estado.name() == 'ENTREGADO').count()}">0</div>
                    <div class="text-muted small">Entregados</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body text-center py-3">
                    <div class="fs-3 fw-bold text-danger"
                         th:text="${misPedidos.stream().filter(p -> p.estado.name() == 'CANCELADO').count()}">0</div>
                    <div class="text-muted small">Cancelados</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pedidos table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Estado</th>
                            <th>Dirección</th>
                            <th>Fecha</th>
                            <th>Entrega prevista</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${misPedidos.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-bag-x fs-2 d-block mb-2"></i>
                                No tienes pedidos. <a th:href="@{/pedidos/nuevo}">¡Haz tu primer pedido!</a>
                            </td>
                        </tr>
                        <tr th:each="pedido : ${misPedidos}">
                            <td><code th:text="${pedido.numeroPedido}"></code></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${pedido.estado.name() == 'ENTREGADO' ? 'bg-success' :
                                                       pedido.estado.name() == 'CANCELADO' ? 'bg-danger' :
                                                       pedido.estado.name() == 'EN_REPARTO' ? 'bg-info' :
                                                       pedido.estado.name() == 'INCIDENCIA' ? 'bg-warning text-dark' :
                                                       pedido.estado.name() == 'PENDIENTE' ? 'bg-secondary' : 'bg-light text-dark'}"
                                      th:text="${pedido.estado.label}"></span>
                            </td>
                            <td th:text="${pedido.direccionEntrega}"></td>
                            <td>
                                <span th:if="${pedido.fechaPedido != null}"
                                      th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy')}"></span>
                            </td>
                            <td>
                                <span th:if="${pedido.fechaEntregaPrevista != null}"
                                      th:text="${#temporals.format(pedido.fechaEntregaPrevista, 'dd/MM/yyyy')}"></span>
                                <span th:if="${pedido.fechaEntregaPrevista == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/pedidos/{id}(id=${pedido.id})}"
                                   class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <form th:if="${pedido.estado.name() == 'EN_PREPARACION' || pedido.estado.name() == 'PENDIENTE'}"
                                      th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('¿Cancelar este pedido?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
