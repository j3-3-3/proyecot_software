<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operario - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold mb-0">
                <i class="bi bi-archive me-2 text-primary"></i>Panel de Operario
            </h1>
            <p class="text-muted mb-0">Bienvenido, <strong th:text="${usuario.getNombreCompleto()}">Operario</strong></p>
        </div>
    </div>

    <!-- Stats -->
    <div class="row g-4 mb-4">
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-grid-fill fs-2 text-primary"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${totalInventario}">0</div>
                        <div class="text-muted small">Productos en stock</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm h-100 border-danger">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-danger bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-exclamation-triangle-fill fs-2 text-danger"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold text-danger" th:text="${productosConBajoStock}">0</div>
                        <div class="text-muted small">Bajo stock</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="row g-3 mb-4">
        <div class="col-12">
            <h5 class="fw-semibold mb-3">Acciones rápidas</h5>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/inventario/entrada}" class="btn btn-outline-primary w-100">
                <i class="bi bi-arrow-down-circle d-block fs-3 mb-1"></i>
                Registrar Entrada
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/inventario}" class="btn btn-outline-info w-100">
                <i class="bi bi-eye d-block fs-3 mb-1"></i>
                Ver Inventario
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/productos/nuevo}" class="btn btn-outline-success w-100">
                <i class="bi bi-plus-circle d-block fs-3 mb-1"></i>
                Nuevo Producto
            </a>
        </div>
        <div class="col-6 col-md-3">
            <a th:href="@{/productos}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-grid d-block fs-3 mb-1"></i>
                Productos
            </a>
        </div>
    </div>

    <!-- Inventory table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom-0 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold"><i class="bi bi-archive me-2"></i>Estado del Inventario</h5>
                <a th:href="@{/inventario}" class="btn btn-sm btn-outline-primary">Ver completo</a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-center">Reservado</th>
                            <th>Ubicación</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${inventario.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No hay productos en inventario.</td>
                        </tr>
                        <tr th:each="inv : ${inventario}"
                            th:classappend="${inv.cantidad <= inv.producto.stockMinimo ? 'table-danger' : ''}">
                            <td th:text="${inv.producto.nombre}"></td>
                            <td><span class="badge bg-light text-dark" th:text="${inv.producto.categoria}"></span></td>
                            <td class="text-center fw-bold" th:text="${inv.cantidad}"></td>
                            <td class="text-center text-muted" th:text="${inv.cantidadReservada}"></td>
                            <td th:text="${inv.ubicacion}"></td>
                            <td>
                                <span th:if="${inv.cantidad <= inv.producto.stockMinimo}"
                                      class="badge bg-danger">Bajo stock</span>
                                <span th:if="${inv.cantidad > inv.producto.stockMinimo}"
                                      class="badge bg-success">OK</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
