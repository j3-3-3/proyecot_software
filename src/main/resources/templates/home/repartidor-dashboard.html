<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Repartidor - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="mb-4">
        <h1 class="h2 fw-bold mb-0">
            <i class="bi bi-truck me-2 text-primary"></i>Panel de Repartidor
        </h1>
        <p class="text-muted mb-0">Bienvenido, <strong th:text="${usuario.getNombreCompleto()}">Repartidor</strong></p>
    </div>

    <!-- Stats -->
    <div class="row g-4 mb-4">
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-box-seam-fill fs-2 text-primary"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${misEntregas.size()}">0</div>
                        <div class="text-muted small">Total mis entregas</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="bg-warning bg-opacity-10 rounded-3 p-3">
                        <i class="bi bi-truck fs-2 text-warning"></i>
                    </div>
                    <div>
                        <div class="fs-3 fw-bold" th:text="${entregasPendientes.size()}">0</div>
                        <div class="text-muted small">Activas</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Deliveries table -->
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom-0 py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-semibold"><i class="bi bi-truck me-2"></i>Mis Entregas</h5>
                <a th:href="@{/entregas}" class="btn btn-sm btn-outline-primary">Ver todas</a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Cliente</th>
                            <th>Dirección</th>
                            <th>Estado</th>
                            <th>Fecha prevista</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${misEntregas.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No tienes entregas asignadas.</td>
                        </tr>
                        <tr th:each="entrega : ${misEntregas}">
                            <td><code th:text="${entrega.numeroPedido}"></code></td>
                            <td th:text="${entrega.cliente.getNombreCompleto()}"></td>
                            <td th:text="${entrega.direccionEntrega}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${entrega.estado.name() == 'ENTREGADO' ? 'bg-success' :
                                                       entrega.estado.name() == 'CANCELADO' ? 'bg-danger' :
                                                       entrega.estado.name() == 'EN_REPARTO' ? 'bg-info' :
                                                       entrega.estado.name() == 'INCIDENCIA' ? 'bg-warning text-dark' :
                                                       entrega.estado.name() == 'PENDIENTE' ? 'bg-secondary' : 'bg-light text-dark'}"
                                      th:text="${entrega.estado.label}"></span>
                            </td>
                            <td>
                                <span th:if="${entrega.fechaEntregaPrevista != null}"
                                      th:text="${#temporals.format(entrega.fechaEntregaPrevista, 'dd/MM/yyyy')}"></span>
                                <span th:if="${entrega.fechaEntregaPrevista == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/entregas/{id}(id=${entrega.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye me-1"></i>Ver
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
