<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle Producto')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/inventario}">Inventario</a></li>
            <li class="breadcrumb-item active" th:text="${producto.nombre}">Producto</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-box-seam text-primary me-2"></i>
                        <span th:text="${producto.nombre}">Producto</span>
                    </h4>
                    <span class="badge text-bg-secondary" th:text="${producto.categoria}">Categoría</span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">DESCRIPCIÓN</label>
                                <p th:text="${producto.descripcion ?: 'Sin descripción'}" class="mb-0">-</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-muted small">UBICACIÓN</label>
                                <p class="mb-0"><i class="bi bi-geo-alt text-secondary me-1"></i>
                                    <span th:text="${producto.ubicacion}">-</span>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center border-0 bg-light">
                                <div class="card-body py-3">
                                    <div class="fs-3 fw-bold"
                                         th:text="${producto.cantidadStock}"
                                         th:classappend="${producto.cantidadStock <= 10} ? 'text-danger' : 'text-success'">0</div>
                                    <div class="text-muted small">Unidades en stock</div>
                                    <span th:if="${producto.cantidadStock <= 10}" class="badge bg-warning text-dark mt-1">Stock bajo</span>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center border-0 bg-light">
                                <div class="card-body py-3">
                                    <div class="fs-3 fw-bold text-primary"
                                         th:text="${#numbers.formatDecimal(producto.precioUnitario, 1, 2)} + ' €'">0.00 €</div>
                                    <div class="text-muted small">Precio unitario</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card text-center border-0 bg-light">
                                <div class="card-body py-3">
                                    <div class="fs-4 fw-bold" th:classappend="${producto.activo} ? 'text-success' : 'text-danger'"
                                         th:text="${producto.activo} ? 'Activo' : 'Inactivo'">-</div>
                                    <div class="text-muted small">Estado</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-top d-flex justify-content-between">
                    <a th:href="@{/inventario}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                    <div class="btn-group">
                        <a th:href="@{/inventario/{id}/editar(id=${producto.id})}" class="btn btn-primary">
                            <i class="bi bi-pencil me-1"></i>Editar
                        </a>
                        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#delModal">
                            <i class="bi bi-trash me-1"></i>Desactivar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Delete Modal -->
<div class="modal fade" id="delModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar desactivación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                ¿Está seguro de que desea desactivar el producto <strong th:text="${producto.nombre}"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form th:action="@{/inventario/{id}/eliminar(id=${producto.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Desactivar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
