<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Inventario - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/inventario}">Inventario</a></li>
            <li class="breadcrumb-item active">Modificar</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h2 class="h4 fw-bold mb-0">
                        <i class="bi bi-pencil me-2 text-primary"></i>Modificar Inventario
                    </h2>
                </div>
                <div class="card-body p-4">
                    <!-- Product info (read-only) -->
                    <div class="alert alert-light border mb-4">
                        <div class="row">
                            <div class="col-sm-6">
                                <strong>Producto:</strong>
                                <span th:text="${inventario.producto.nombre}"></span>
                            </div>
                            <div class="col-sm-6">
                                <strong>Categoría:</strong>
                                <span th:text="${inventario.producto.categoria}"></span>
                            </div>
                            <div class="col-sm-6 mt-2">
                                <strong>Proveedor:</strong>
                                <span th:text="${inventario.producto.proveedor}"></span>
                            </div>
                            <div class="col-sm-6 mt-2">
                                <strong>Stock actual:</strong>
                                <strong class="text-primary" th:text="${inventario.cantidad}"></strong>
                                (Reservado: <span th:text="${inventario.cantidadReservada}"></span>)
                            </div>
                        </div>
                    </div>

                    <form th:action="@{/inventario/{id}/editar(id=${inventario.id})}" method="post"
                          th:object="${inventario}" novalidate>
                        <input type="hidden" name="productoId" th:value="${inventario.producto.id}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="cantidad" class="form-label fw-semibold">
                                    Cantidad <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control"
                                       th:class="${#fields.hasErrors('cantidad')} ? 'form-control is-invalid' : 'form-control'"
                                       id="cantidad" th:field="*{cantidad}" min="0" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}"
                                     th:errors="*{cantidad}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="numeroLote" class="form-label fw-semibold">Número de Lote</label>
                                <input type="text" class="form-control" id="numeroLote"
                                       th:field="*{numeroLote}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="ubicacion" class="form-label fw-semibold">
                                Ubicación <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control"
                                   th:class="${#fields.hasErrors('ubicacion')} ? 'form-control is-invalid' : 'form-control'"
                                   id="ubicacion" th:field="*{ubicacion}" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ubicacion')}"
                                 th:errors="*{ubicacion}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="motivoUltimoCambio" class="form-label fw-semibold">
                                Motivo del cambio <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" id="motivoUltimoCambio"
                                      th:field="*{motivoUltimoCambio}" rows="2"
                                      placeholder="Describe el motivo del ajuste..." required></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Guardar Cambios
                            </button>
                            <a th:href="@{/inventario}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
