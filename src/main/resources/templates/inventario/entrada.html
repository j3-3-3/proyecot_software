<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Entrada - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/inventario}">Inventario</a></li>
            <li class="breadcrumb-item active">Registrar entrada</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h2 class="h4 fw-bold mb-0">
                        <i class="bi bi-arrow-down-circle me-2 text-primary"></i>Registrar Entrada de Mercancía
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/inventario/entrada}" method="post"
                          th:object="${inventario}" novalidate>

                        <div class="mb-3">
                            <label for="productoId" class="form-label fw-semibold">
                                Producto <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" id="productoId" name="productoId" required>
                                <option value="">-- Selecciona un producto --</option>
                                <option th:each="p : ${productos}"
                                        th:value="${p.id}"
                                        th:text="${p.nombre + ' (' + p.categoria + ')'}">
                                </option>
                            </select>
                            <div class="mt-1">
                                <small class="text-muted">¿No está el producto?
                                    <a th:href="@{/productos/nuevo}" target="_blank">Crear nuevo producto</a>
                                </small>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="cantidad" class="form-label fw-semibold">
                                    Cantidad <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control"
                                       th:class="${#fields.hasErrors('cantidad')} ? 'form-control is-invalid' : 'form-control'"
                                       id="cantidad" th:field="*{cantidad}" min="1" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}"
                                     th:errors="*{cantidad}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="numeroLote" class="form-label fw-semibold">Número de Lote</label>
                                <input type="text" class="form-control" id="numeroLote"
                                       th:field="*{numeroLote}" placeholder="Ej: LOT-2025-001">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="ubicacion" class="form-label fw-semibold">
                                Ubicación en Almacén <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control"
                                   th:class="${#fields.hasErrors('ubicacion')} ? 'form-control is-invalid' : 'form-control'"
                                   id="ubicacion" th:field="*{ubicacion}"
                                   placeholder="Ej: A-01-02 (Pasillo-Estantería-Nivel)" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('ubicacion')}"
                                 th:errors="*{ubicacion}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="motivoUltimoCambio" class="form-label fw-semibold">Notas / Motivo</label>
                            <textarea class="form-control" id="motivoUltimoCambio"
                                      th:field="*{motivoUltimoCambio}" rows="2"
                                      placeholder="Observaciones sobre esta entrada..."></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Registrar Entrada
                            </button>
                            <a th:href="@{/inventario}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
