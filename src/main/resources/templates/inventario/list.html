<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold mb-0"><i class="bi bi-archive me-2 text-primary"></i>Inventario</h1>
        <a th:href="@{/inventario/entrada}" class="btn btn-primary">
            <i class="bi bi-arrow-down-circle me-2"></i>Registrar Entrada
        </a>
    </div>

    <!-- Bajo stock alert -->
    <div th:if="${!alertasBajoStock.isEmpty()}" class="alert alert-warning d-flex align-items-center mb-4">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <div>
            <strong>Alerta:</strong>
            <span th:text="${alertasBajoStock.size()}"></span> producto(s) con stock bajo o agotado.
            <a href="#" onclick="document.getElementById('filtro-bajo-stock').click()">Ver solo estos</a>
        </div>
    </div>

    <!-- Search bar -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/inventario}" method="get" class="row g-2">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" name="busqueda"
                               placeholder="Buscar por producto, categoría o ubicación..."
                               th:value="${busqueda}">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Buscar</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/inventario}" class="btn btn-outline-secondary w-100">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Inventory Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Proveedor</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-center">Reservado</th>
                            <th class="text-center">Disponible</th>
                            <th>Ubicación</th>
                            <th>Lote</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${inventario.isEmpty()}">
                            <td colspan="11" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay registros de inventario.
                            </td>
                        </tr>
                        <tr th:each="inv, iterStat : ${inventario}"
                            th:classappend="${inv.cantidad <= inv.producto.stockMinimo ? 'table-warning' : ''}">
                            <td th:text="${iterStat.count}"></td>
                            <td>
                                <strong th:text="${inv.producto.nombre}"></strong>
                            </td>
                            <td><span class="badge bg-light text-dark" th:text="${inv.producto.categoria}"></span></td>
                            <td th:text="${inv.producto.proveedor}"></td>
                            <td class="text-center fw-bold" th:text="${inv.cantidad}"></td>
                            <td class="text-center text-muted" th:text="${inv.cantidadReservada}"></td>
                            <td class="text-center">
                                <strong th:text="${inv.getStockDisponible()}"
                                        th:classappend="${inv.getStockDisponible() == 0 ? 'text-danger' : 'text-success'}"></strong>
                            </td>
                            <td th:text="${inv.ubicacion}"></td>
                            <td>
                                <span th:if="${inv.numeroLote != null}" th:text="${inv.numeroLote}" class="text-muted small"></span>
                                <span th:if="${inv.numeroLote == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <span th:if="${inv.cantidad == 0}" class="badge bg-danger">Agotado</span>
                                <span th:if="${inv.cantidad > 0 and inv.cantidad <= inv.producto.stockMinimo}"
                                      class="badge bg-warning text-dark">Bajo stock</span>
                                <span th:if="${inv.cantidad > inv.producto.stockMinimo}"
                                      class="badge bg-success">Disponible</span>
                            </td>
                            <td>
                                <a th:href="@{/inventario/{id}/editar(id=${inv.id})}"
                                   class="btn btn-sm btn-outline-secondary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
