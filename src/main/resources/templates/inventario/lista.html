<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inventario')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold"><i class="bi bi-boxes me-2 text-primary"></i>Inventario</h2>
        <a th:href="@{/inventario/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuevo Producto
        </a>
    </div>

    <!-- Search & Filter -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/inventario}" method="get" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label fw-semibold small">Buscar producto</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" name="q" th:value="${q}"
                               placeholder="Nombre o categoría...">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-search me-1"></i>Buscar
                    </button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/inventario}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle me-1"></i>Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Products Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Ubicación</th>
                            <th class="text-end">Precio Unit.</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No se encontraron productos.
                            </td>
                        </tr>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.id}" class="text-muted small">#</td>
                            <td>
                                <span class="fw-semibold" th:text="${p.nombre}">Nombre</span>
                                <div class="text-muted small" th:if="${p.descripcion != null and !#strings.isEmpty(p.descripcion)}"
                                     th:text="${#strings.abbreviate(p.descripcion, 50)}"></div>
                            </td>
                            <td>
                                <span class="badge text-bg-secondary" th:text="${p.categoria}">Cat</span>
                            </td>
                            <td>
                                <span th:text="${p.cantidadStock}"
                                      th:classappend="${p.cantidadStock <= 10} ? 'text-danger fw-bold' : 'text-success fw-semibold'">0</span>
                                <span th:if="${p.cantidadStock <= 10}" class="badge bg-warning text-dark ms-1 small">¡Bajo!</span>
                            </td>
                            <td class="text-muted small" th:text="${p.ubicacion}">-</td>
                            <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(p.precioUnitario, 1, 2)} + ' €'">0.00 €</td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/inventario/{id}(id=${p.id})}" class="btn btn-outline-secondary" title="Ver detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/inventario/{id}/editar(id=${p.id})}" class="btn btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-outline-danger" title="Eliminar"
                                            data-bs-toggle="modal" th:data-bs-target="'#delModal' + ${p.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                                <!-- Delete Modal -->
                                <div class="modal fade" th:id="'delModal' + ${p.id}" tabindex="-1">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title">Confirmar desactivación</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body text-start">
                                                ¿Desactivar el producto <strong th:text="${p.nombre}"></strong>?
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <form th:action="@{/inventario/{id}/eliminar(id=${p.id})}" method="post">
                                                    <button type="submit" class="btn btn-danger">Desactivar</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${#lists.size(productos)}">0</strong> productos
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
