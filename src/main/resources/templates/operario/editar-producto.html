<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ajustar Stock')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('inventario')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Ajustar Stock')}"></div>
        <main class="content">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header bg-white border-bottom">
                            <h6 class="mb-0 fw-semibold">
                                <i class="bi bi-pencil me-2 text-primary"></i>Ajustar stock del producto
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info mb-4">
                                <strong th:text="${producto.nombre}">Producto</strong>
                                <br>
                                <small>
                                    Stock actual: <strong th:text="${producto.stock}">0</strong> |
                                    Ubicación: <span th:text="${producto.ubicacion ?: '—'}">—</span>
                                </small>
                            </div>
                            <form th:action="@{/operario/inventario/{id}/ajustar(id=${producto.id})}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nuevo stock <span class="text-danger">*</span></label>
                                    <input type="number" name="nuevoStock" class="form-control"
                                           min="0" th:value="${producto.stock}" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Motivo del ajuste</label>
                                    <textarea name="motivo" class="form-control" rows="2"
                                              placeholder="Ej: Corrección por inventario físico..."></textarea>
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save me-2"></i>Guardar ajuste
                                    </button>
                                    <a th:href="@{/operario/inventario}" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Cancelar
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
