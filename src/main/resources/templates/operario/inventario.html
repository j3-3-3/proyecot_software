<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inventario — Operario')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('inventario')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Inventario')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-semibold mb-0">Consultar inventario</h5>
                <a th:href="@{/operario/entrada-producto}" class="btn btn-success">
                    <i class="bi bi-box-arrow-in-down me-2"></i>Registrar entrada
                </a>
            </div>

            <!-- Search -->
            <form th:action="@{/operario/inventario}" method="get" class="mb-4">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" name="buscar" class="form-control" placeholder="Buscar producto..."
                           th:value="${buscar}">
                    <button type="submit" class="btn btn-outline-secondary">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/operario/inventario}" class="btn btn-outline-secondary" th:if="${buscar}">
                        <i class="bi bi-x"></i>
                    </a>
                </div>
            </form>

            <div class="card">
                <div class="card-body p-0">
                    <div th:if="${productos.isEmpty()}" class="text-center text-muted p-5">
                        <i class="bi bi-inbox fs-1"></i>
                        <p class="mt-2">No se encontraron productos</p>
                    </div>
                    <div class="table-responsive" th:unless="${productos.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Ubicación</th>
                                <th class="text-center">Stock</th>
                                <th class="text-center">Mínimo</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${productos}"
                                th:classappend="${p.stock <= p.stockMinimo} ? 'table-warning' : ''">
                                <td th:text="${p.id}">1</td>
                                <td>
                                    <div class="fw-semibold" th:text="${p.nombre}">Nombre</div>
                                    <small class="text-muted" th:text="${p.descripcion}"></small>
                                </td>
                                <td><span class="badge bg-secondary" th:text="${p.categoria ?: '—'}">Cat</span></td>
                                <td th:text="${p.ubicacion ?: '—'}">—</td>
                                <td class="text-center">
                                    <span th:classappend="${p.stock <= p.stockMinimo} ? 'text-danger fw-bold' : 'text-success'"
                                          th:text="${p.stock}">0</span>
                                </td>
                                <td class="text-center" th:text="${p.stockMinimo}">5</td>
                                <td class="text-end">
                                    <a th:href="@{/operario/inventario/{id}/editar(id=${p.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Ajustar
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
