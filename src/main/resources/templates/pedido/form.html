<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Pedido - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/pedidos}">Mis Pedidos</a></li>
            <li class="breadcrumb-item active">Nuevo Pedido</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h2 class="h4 fw-bold mb-0">
                        <i class="bi bi-cart-plus me-2 text-primary"></i>Solicitar Nuevo Pedido
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/pedidos/nuevo}" method="post" id="pedidoForm">

                        <div class="mb-3">
                            <label for="direccionEntrega" class="form-label fw-semibold">
                                Dirección de entrega <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" id="direccionEntrega"
                                   name="direccionEntrega"
                                   placeholder="Calle, número, piso, ciudad..."
                                   required>
                        </div>

                        <!-- Products catalog -->
                        <hr>
                        <h5 class="fw-semibold mb-3"><i class="bi bi-grid me-2"></i>Catálogo de Productos</h5>

                        <div class="row g-3 mb-3" th:if="${!productos.isEmpty()}">
                            <div th:each="inv : ${productos}" class="col-12 col-md-6">
                                <div class="card border h-100">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <div>
                                                <h6 class="fw-semibold mb-1" th:text="${inv.producto.nombre}"></h6>
                                                <span class="badge bg-light text-dark me-1"
                                                      th:text="${inv.producto.categoria}"></span>
                                            </div>
                                            <div class="text-end">
                                                <div class="fw-bold text-primary"
                                                     th:text="${#numbers.formatDecimal(inv.producto.precio, 1, 2) + ' €'}"></div>
                                                <small class="text-muted">
                                                    Disponible: <strong th:text="${inv.getStockDisponible()}"></strong>
                                                </small>
                                            </div>
                                        </div>
                                        <div class="mt-2 d-flex align-items-center gap-2">
                                            <input type="checkbox" class="form-check-input producto-check"
                                                   th:id="'chk-' + ${inv.producto.id}"
                                                   th:data-inv="${inv.producto.id}"
                                                   onchange="toggleProducto(this)">
                                            <label th:for="'chk-' + ${inv.producto.id}" class="form-check-label">Añadir al pedido</label>
                                        </div>
                                        <div class="mt-2 producto-qty d-none"
                                             th:id="'qty-' + ${inv.producto.id}">
                                            <div class="input-group input-group-sm">
                                                <span class="input-group-text">Cantidad</span>
                                                <input type="number" class="form-control"
                                                       th:name="'cantidades'"
                                                       th:id="'cant-' + ${inv.producto.id}"
                                                       min="1"
                                                       th:max="${inv.getStockDisponible()}"
                                                       value="1" disabled>
                                                <input type="hidden" th:name="'productoIds'"
                                                       th:id="'pid-' + ${inv.producto.id}"
                                                       th:value="${inv.producto.id}" disabled>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div th:if="${productos.isEmpty()}" class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            No hay productos disponibles en este momento.
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary" th:if="${!productos.isEmpty()}">
                                <i class="bi bi-check-circle me-2"></i>Confirmar Pedido
                            </button>
                            <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleProducto(checkbox) {
        const invId = checkbox.getAttribute('data-inv');
        const qtyDiv = document.getElementById('qty-' + invId);
        const cantInput = document.getElementById('cant-' + invId);
        const pidInput = document.getElementById('pid-' + invId);

        if (checkbox.checked) {
            qtyDiv.classList.remove('d-none');
            cantInput.disabled = false;
            pidInput.disabled = false;
        } else {
            qtyDiv.classList.add('d-none');
            cantInput.disabled = true;
            pidInput.disabled = true;
        }
    }
</script>
</body>
</html>
