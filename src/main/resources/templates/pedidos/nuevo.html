<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Pedido')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/pedidos}">Pedidos</a></li>
            <li class="breadcrumb-item active">Nuevo Pedido</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-cart-plus text-primary me-2"></i>Nuevo Pedido
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/pedidos/nuevo}" th:object="${pedidoForm}" method="post" novalidate>

                        <!-- Delivery Info -->
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <h6 class="fw-bold text-muted text-uppercase small mb-3">Datos de Entrega</h6>
                            </div>
                            <div class="col-12">
                                <label for="direccionEntrega" class="form-label fw-semibold">Dirección de Entrega <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="direccionEntrega"
                                       th:field="*{direccionEntrega}"
                                       th:classappend="${#fields.hasErrors('direccionEntrega')} ? 'is-invalid'"
                                       placeholder="Calle, número, ciudad, código postal">
                                <div class="invalid-feedback" th:errors="*{direccionEntrega}"></div>
                            </div>
                            <div class="col-12">
                                <label for="observaciones" class="form-label fw-semibold">Observaciones</label>
                                <textarea class="form-control" id="observaciones" th:field="*{observaciones}"
                                          rows="2" placeholder="Instrucciones especiales para la entrega..."></textarea>
                            </div>
                        </div>

                        <!-- Products -->
                        <div class="mb-4">
                            <h6 class="fw-bold text-muted text-uppercase small mb-3">Productos</h6>
                            <div class="table-responsive">
                                <table class="table table-bordered align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Producto</th>
                                            <th style="width:140px">Cantidad</th>
                                            <th style="width:50px"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemsContainer">
                                        <tr th:each="item, iterStat : *{items}" class="item-row">
                                            <td>
                                                <select th:field="*{items[__${iterStat.index}__].productoId}"
                                                        class="form-select producto-select">
                                                    <option value="">-- Seleccionar producto --</option>
                                                    <option th:each="p : ${productosDisponibles}"
                                                            th:value="${p.id}"
                                                            th:text="${p.nombre} + ' (Stock: ' + ${p.cantidadStock} + ') - ' + ${#numbers.formatDecimal(p.precioUnitario,1,2)} + '€'">
                                                    </option>
                                                </select>
                                            </td>
                                            <td>
                                                <input type="number"
                                                       th:field="*{items[__${iterStat.index}__].cantidad}"
                                                       class="form-control" min="1" placeholder="1">
                                            </td>
                                            <td class="text-center">
                                                <button type="button" class="btn btn-sm btn-outline-danger remove-row"
                                                        title="Eliminar fila">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <button type="button" id="addRow" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-plus-circle me-1"></i>Añadir producto
                            </button>
                        </div>

                        <hr class="my-4">
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i>Crear Pedido
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:inline="javascript">
    const productosDisponibles = /*[[${productosDisponibles}]]*/ [];
    let rowCount = document.querySelectorAll('.item-row').length;

    document.getElementById('addRow').addEventListener('click', function () {
        const container = document.getElementById('itemsContainer');
        const idx = rowCount++;
        const row = document.createElement('tr');
        row.className = 'item-row';

        let options = '<option value="">-- Seleccionar producto --</option>';
        document.querySelectorAll('.producto-select')[0]?.querySelectorAll('option').forEach(opt => {
            if (opt.value) options += `<option value="${opt.value}">${opt.text}</option>`;
        });

        row.innerHTML = `
            <td>
                <select name="items[${idx}].productoId" class="form-select producto-select">
                    ${options}
                </select>
            </td>
            <td>
                <input type="number" name="items[${idx}].cantidad" class="form-control" min="1" placeholder="1">
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger remove-row" title="Eliminar fila">
                    <i class="bi bi-trash"></i>
                </button>
            </td>`;
        container.appendChild(row);
        attachRemoveListeners();
    });

    function attachRemoveListeners() {
        document.querySelectorAll('.remove-row').forEach(btn => {
            btn.onclick = function () {
                const rows = document.querySelectorAll('.item-row');
                if (rows.length > 1) {
                    btn.closest('tr').remove();
                }
            };
        });
    }
    attachRemoveListeners();
</script>
</body>
</html>
