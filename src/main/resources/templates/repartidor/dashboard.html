<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Repartidor — Dashboard')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Mi Panel')}" ></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-sm-6 col-xl-4">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                                <i class="bi bi-truck"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Entregas asignadas</div>
                                <div class="fs-3 fw-bold" th:text="${misEntregas.size()}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="card stat-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                                <i class="bi bi-clock"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Entregas activas</div>
                                <div class="fs-3 fw-bold" th:text="${entregasActivas}">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- My deliveries summary -->
            <div class="card">
                <div class="card-header bg-white border-bottom fw-semibold d-flex align-items-center">
                    <i class="bi bi-truck me-2 text-primary"></i>Mis entregas
                    <a th:href="@{/repartidor/mis-entregas}" class="btn btn-sm btn-outline-primary ms-auto">Ver todas</a>
                </div>
                <div class="card-body p-0">
                    <div th:if="${misEntregas.isEmpty()}" class="text-center text-muted p-5">
                        <i class="bi bi-inbox fs-1"></i>
                        <p class="mt-2">No tienes entregas asignadas</p>
                    </div>
                    <div class="table-responsive" th:unless="${misEntregas.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Dirección</th>
                                <th>Fecha prevista</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="e : ${misEntregas}" th:if="${e.estado.name() != 'CANCELADO' && e.estado.name() != 'ENTREGADO'}">
                                <td th:text="${e.id}">1</td>
                                <td class="fw-semibold" th:text="${e.pedido.cliente.nombre}">Cliente</td>
                                <td th:text="${e.pedido.direccionEntrega ?: '—'}">—</td>
                                <td th:text="${e.fechaPrevista != null ? e.fechaPrevista : '—'}">—</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="'badge-estado-' + ${e.estado.name()}"
                                          th:text="${e.estado.name().replace('_',' ')}">Estado</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/repartidor/entregas/{id}(id=${e.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil-square me-1"></i>Actualizar
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
