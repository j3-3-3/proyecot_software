<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Mis Entregas')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('entregas')}"></div>
    <div class="main-area">
        <div th:replace="~{fragments/layout :: topbar('Mis Entregas')}"></div>
        <main class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card">
                <div class="card-header bg-white border-bottom fw-semibold">
                    <i class="bi bi-truck me-2 text-primary"></i>Mis entregas asignadas
                </div>
                <div class="card-body p-0">
                    <div th:if="${entregas.isEmpty()}" class="text-center text-muted p-5">
                        <i class="bi bi-inbox fs-1"></i>
                        <p class="mt-2">No tienes entregas asignadas</p>
                    </div>
                    <div class="table-responsive" th:unless="${entregas.isEmpty()}">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Dirección entrega</th>
                                <th>Vehículo</th>
                                <th>Fecha prevista</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="e : ${entregas}">
                                <td th:text="${e.id}">1</td>
                                <td class="fw-semibold" th:text="${e.pedido.cliente.nombre}">Cliente</td>
                                <td th:text="${e.pedido.direccionEntrega ?: '—'}">—</td>
                                <td th:text="${e.vehiculo != null ? e.vehiculo.matricula : '—'}">—</td>
                                <td th:text="${e.fechaPrevista != null ? e.fechaPrevista : '—'}">—</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="'badge-estado-' + ${e.estado.name()}"
                                          th:text="${e.estado.name().replace('_',' ')}">Estado</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/repartidor/entregas/{id}(id=${e.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       th:if="${e.estado.name() != 'ENTREGADO' && e.estado.name() != 'CANCELADO'}">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
