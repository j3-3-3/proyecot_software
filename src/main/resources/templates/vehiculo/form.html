<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${vehiculo.id == null ? 'Nuevo Vehículo' : 'Editar Vehículo'} + ' - LogiSoft'">Vehículo - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/vehiculos}">Vehículos</a></li>
            <li class="breadcrumb-item active"
                th:text="${vehiculo.id == null ? 'Nuevo vehículo' : 'Editar vehículo'}"></li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h2 class="h4 fw-bold mb-0">
                        <i class="bi bi-car-front me-2 text-primary"></i>
                        <span th:text="${vehiculo.id == null ? 'Registrar Vehículo' : 'Editar Vehículo'}"></span>
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form th:action="${vehiculo.id == null ? '/vehiculos/nuevo' : '/vehiculos/' + vehiculo.id + '/editar'}"
                          method="post" th:object="${vehiculo}" novalidate>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="matricula" class="form-label fw-semibold">
                                    Matrícula <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control"
                                       th:class="${#fields.hasErrors('matricula')} ? 'form-control is-invalid' : 'form-control'"
                                       id="matricula" th:field="*{matricula}"
                                       placeholder="Ej: 1234 ABC"
                                       th:readonly="${vehiculo.id != null}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}"
                                     th:errors="*{matricula}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="anio" class="form-label fw-semibold">
                                    Año <span class="text-danger">*</span>
                                </label>
                                <input type="number" class="form-control"
                                       th:class="${#fields.hasErrors('anio')} ? 'form-control is-invalid' : 'form-control'"
                                       id="anio" th:field="*{anio}"
                                       min="2000" max="2030" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('anio')}"
                                     th:errors="*{anio}"></div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="marca" class="form-label fw-semibold">
                                    Marca <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control"
                                       th:class="${#fields.hasErrors('marca')} ? 'form-control is-invalid' : 'form-control'"
                                       id="marca" th:field="*{marca}"
                                       placeholder="Ej: Ford" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}"
                                     th:errors="*{marca}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="modelo" class="form-label fw-semibold">
                                    Modelo <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control"
                                       th:class="${#fields.hasErrors('modelo')} ? 'form-control is-invalid' : 'form-control'"
                                       id="modelo" th:field="*{modelo}"
                                       placeholder="Ej: Transit" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}"
                                     th:errors="*{modelo}"></div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="fechaUltimoMantenimiento" class="form-label fw-semibold">
                                    Último mantenimiento
                                </label>
                                <input type="date" class="form-control" id="fechaUltimoMantenimiento"
                                       th:field="*{fechaUltimoMantenimiento}">
                            </div>
                            <div class="col-md-6">
                                <label for="fechaProximoMantenimiento" class="form-label fw-semibold">
                                    Próximo mantenimiento
                                </label>
                                <input type="date" class="form-control" id="fechaProximoMantenimiento"
                                       th:field="*{fechaProximoMantenimiento}">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="notasMantenimiento" class="form-label fw-semibold">
                                Notas de mantenimiento
                            </label>
                            <textarea class="form-control" id="notasMantenimiento"
                                      th:field="*{notasMantenimiento}" rows="2"
                                      placeholder="Observaciones sobre el mantenimiento..."></textarea>
                        </div>

                        <div class="mb-4 form-check" th:if="${vehiculo.id != null}">
                            <input type="checkbox" class="form-check-input" id="disponible"
                                   th:field="*{disponible}">
                            <label class="form-check-label" for="disponible">Disponible para entregas</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-2"></i>Guardar
                            </button>
                            <a th:href="@{/vehiculos}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-2"></i>Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
