<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehículos - LogiSoft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-3">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
</div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 fw-bold mb-0"><i class="bi bi-car-front me-2 text-primary"></i>Vehículos</h1>
        <a th:href="@{/vehiculos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Registrar Vehículo
        </a>
    </div>

    <!-- Maintenance alert -->
    <div th:each="v : ${vehiculos}" th:if="${v.isMantenimientoPorVencer()}">
        <div class="alert alert-warning d-flex align-items-center mb-2">
            <i class="bi bi-tools me-2 fs-5"></i>
            <div>
                El vehículo <strong th:text="${v.marca + ' ' + v.modelo + ' (' + v.matricula + ')'}"></strong>
                tiene el mantenimiento por vencer o vencido
                <span th:if="${v.fechaProximoMantenimiento != null}"
                      th:text="'(fecha: ' + ${#temporals.format(v.fechaProximoMantenimiento, 'dd/MM/yyyy')} + ')'"></span>.
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Matrícula</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Disponible</th>
                            <th>Próx. mantenimiento</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${vehiculos.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-5">
                                <i class="bi bi-car-front fs-2 d-block mb-2"></i>
                                No hay vehículos registrados.
                            </td>
                        </tr>
                        <tr th:each="v : ${vehiculos}"
                            th:classappend="${v.isMantenimientoPorVencer() ? 'table-warning' : ''}">
                            <td><strong th:text="${v.matricula}"></strong></td>
                            <td th:text="${v.marca}"></td>
                            <td th:text="${v.modelo}"></td>
                            <td th:text="${v.anio}"></td>
                            <td>
                                <span th:if="${v.disponible}" class="badge bg-success">Disponible</span>
                                <span th:if="${!v.disponible}" class="badge bg-danger">En uso</span>
                            </td>
                            <td>
                                <span th:if="${v.fechaProximoMantenimiento != null}"
                                      th:text="${#temporals.format(v.fechaProximoMantenimiento, 'dd/MM/yyyy')}"
                                      th:classappend="${v.isMantenimientoPorVencer() ? 'text-warning fw-bold' : ''}"></span>
                                <span th:if="${v.fechaProximoMantenimiento == null}" class="text-muted">-</span>
                            </td>
                            <td>
                                <a th:href="@{/vehiculos/{id}/editar(id=${v.id})}"
                                   class="btn btn-sm btn-outline-secondary me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/vehiculos/{id}/eliminar(id=${v.id})}" method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('¿Eliminar este vehículo?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
