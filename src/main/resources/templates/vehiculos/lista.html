<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: messages}"></div>

<main class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold"><i class="bi bi-car-front me-2 text-primary"></i>Vehículos</h2>
        <a th:href="@{/vehiculos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nuevo Vehículo
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Matrícula</th>
                            <th>Marca / Modelo</th>
                            <th>Tipo</th>
                            <th>Disponible</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(vehiculos)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                No hay vehículos registrados.
                            </td>
                        </tr>
                        <tr th:each="v : ${vehiculos}">
                            <td class="text-muted small" th:text="${v.id}">#</td>
                            <td class="fw-bold" th:text="${v.matricula}">Matrícula</td>
                            <td th:text="${v.marca} + ' ' + ${v.modelo}">Marca Modelo</td>
                            <td>
                                <span class="badge text-bg-secondary" th:text="${v.tipo}">Tipo</span>
                            </td>
                            <td>
                                <span th:if="${v.disponible}" class="badge text-bg-success">
                                    <i class="bi bi-check-circle me-1"></i>Disponible
                                </span>
                                <span th:if="${!v.disponible}" class="badge text-bg-danger">
                                    <i class="bi bi-x-circle me-1"></i>En uso
                                </span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/vehiculos/{id}/editar(id=${v.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil me-1"></i>Editar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small">
            Total: <strong th:text="${#lists.size(vehiculos)}">0</strong> vehículos activos
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
